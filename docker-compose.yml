version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chanchito
      POSTGRES_PASSWORD: chanchito_password
      POSTGRES_DB: chanchito
    ports:
      - "5432:5432"
    volumes:
      - chanchito_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanchito"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://chanchito:chanchito_password@db:5432/chanchito?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "80:80"

volumes:
  chanchito_data:
